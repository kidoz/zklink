name: Build and verification

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore ZkLink.slnx --locked-mode
      - name: Restore formatter
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Build and check public API
        run: dotnet build ZkLink.slnx -c Release --no-restore
      - name: Test public contracts
        run: dotnet test --project tests/ZkLink.Tests -c Release --no-build --no-restore
      - name: Test protocol
        run: dotnet test --project tests/ZkLink.Protocol.Tests -c Release --no-build --no-restore
      - name: Test dependency injection
        run: dotnet test --project tests/ZkLink.Extensions.DependencyInjection.Tests -c Release --no-build --no-restore
      - name: Test analyzers
        run: dotnet test --project tests/ZkLink.Analyzers.Tests -c Release --no-build --no-restore
      - name: Test fault proxy
        run: dotnet test --project tests/ZkLink.FaultTests -c Release --no-build --no-restore --filter-trait Fixture=ProxyUnit
      - name: Test soak resource observers
        run: dotnet test --project tests/ZkLink.FaultTests -c Release --no-build --no-restore --filter-trait Fixture=SoakUnit
      - name: Verify analyzer package consumer
        if: runner.os == 'Linux'
        run: bash dev/test-analyzers-package.sh

  allocations:
    name: Protocol and framing allocation budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked benchmark dependencies
        run: dotnet restore benchmarks/ZkLink.Benchmarks --locked-mode
      - name: Record allocation environment
        run: |
          mkdir -p artifacts/benchmarks
          dotnet --info > artifacts/benchmarks/dotnet-info.txt
          git rev-parse HEAD > artifacts/benchmarks/revision.txt
          cp benchmarks/ZkLink.Benchmarks/allocation-budgets.json artifacts/benchmarks/allocation-budgets.json
      - name: Check allocation budgets
        run: dotnet run --project benchmarks/ZkLink.Benchmarks -c Release --no-restore -- --allocations artifacts/benchmarks/allocations.json
      - name: Retain allocation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-results
          path: artifacts/benchmarks
          if-no-files-found: error

  live-benchmarks:
    name: Live concurrent request benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify live measurements and cleanup on both versions
        env:
          ZKLINK_BENCHMARK_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/live-benchmarks
        run: bash dev/run-live-benchmarks.sh 1
      - name: Retain live benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-benchmark-smoke
          path: artifacts/live-benchmarks
          if-no-files-found: error

  watch-benchmarks:
    name: Live shared watch fan-out benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify watch fan-out and cleanup on both versions
        env:
          ZKLINK_BENCHMARK_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/watch-benchmarks
        run: bash dev/run-live-benchmarks.sh --watches 1
      - name: Retain watch benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watch-benchmark-smoke
          path: artifacts/watch-benchmarks
          if-no-files-found: error

  operations:
    name: Live node, ACL, transaction, auxiliary and watch operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify both pinned server versions
        env:
          ZKLINK_MATRIX_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/live-tests
        run: bash dev/test-zookeeper-matrix.sh --operations
      - name: Retain server and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-operations-matrix
          path: artifacts/live-tests
          if-no-files-found: error

  member-faults:
    name: Connected ${{ matrix.role }} fault and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        role: [follower, leader, quorum, partition, peer, pressure, soak]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify faults and watch pressure on both pinned versions
        env:
          ZKLINK_MATRIX_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/${{ matrix.role }}-faults
        run: bash dev/test-zookeeper-node-faults.sh "${{ matrix.role }}"
      - name: Retain fault and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.role }}-outage-matrix
          path: artifacts/${{ matrix.role }}-faults
          if-no-files-found: error

  ttl:
    name: TTL enabled and disabled servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify both pinned server versions
        env:
          ZKLINK_MATRIX_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/ttl-tests
        run: bash dev/test-zookeeper-matrix.sh --ttl
      - name: Retain server and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ttl-operations-matrix
          path: artifacts/ttl-tests
          if-no-files-found: error

  security:
    name: Live client TLS and mutual TLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify secure fixtures on both pinned versions
        env:
          ZKLINK_MATRIX_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/security-tests
        run: bash dev/test-zookeeper-security.sh
      - name: Verify bounded concurrent TLS rejections on both pinned versions
        env:
          ZKLINK_MATRIX_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/security-tests
        run: bash dev/test-zookeeper-security.sh --concurrent
      - name: Retain public security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-matrix
          path: artifacts/security-tests
          if-no-files-found: error

  java-oracle:
    name: Apache Java protocol verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install Java reference runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.5+8.0.LTS'
      - name: Verify fixtures and C# requests using Gradle
        run: bash dev/test-jute-oracle.sh
      - name: Retain allocation baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-allocation-baseline
          path: artifacts/jute-oracle/allocation-baseline.json
          if-no-files-found: error
