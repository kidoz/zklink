name: Build and verification

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore ZkLink.slnx --locked-mode
      - name: Restore formatter
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Build and check public API
        run: dotnet build ZkLink.slnx -c Release --no-restore
      - name: Test public contracts
        run: dotnet test --project tests/ZkLink.Tests -c Release --no-build --no-restore
      - name: Test protocol
        run: dotnet test --project tests/ZkLink.Protocol.Tests -c Release --no-build --no-restore

  operations:
    name: Live node, ACL, transaction and auxiliary operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify both pinned server versions
        env:
          ZKLINK_MATRIX_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/live-tests
        run: bash dev/test-zookeeper-matrix.sh --operations
      - name: Retain server and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-operations-matrix
          path: artifacts/live-tests
          if-no-files-found: error

  ttl:
    name: TTL enabled and disabled servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify both pinned server versions
        env:
          ZKLINK_MATRIX_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/ttl-tests
        run: bash dev/test-zookeeper-matrix.sh --ttl
      - name: Retain server and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ttl-operations-matrix
          path: artifacts/ttl-tests
          if-no-files-found: error

  java-oracle:
    name: Apache Java protocol verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install Java reference runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Verify fixtures and C# requests using Gradle
        run: bash dev/test-jute-oracle.sh
      - name: Retain allocation baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-allocation-baseline
          path: artifacts/jute-oracle/allocation-baseline.json
          if-no-files-found: error
