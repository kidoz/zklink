name: Build and server-free tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore ZkLink.slnx --locked-mode
      - name: Restore formatter
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Build and check public API
        run: dotnet build ZkLink.slnx -c Release --no-restore
      - name: Test public contracts
        run: dotnet test --project tests/ZkLink.Tests -c Release --no-build --no-restore
      - name: Test protocol
        run: dotnet test --project tests/ZkLink.Protocol.Tests -c Release --no-build --no-restore
