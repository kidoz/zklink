name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }} / ${{ (github.event_name == 'release' || inputs.publish) && 'publish to NuGet' || 'validate only' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        type: string
        required: true
      publish:
        description: Publish the verified package to NuGet.org
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      candidate-run-id: ${{ steps.release.outputs.candidate-run-id }}
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate release tag, changelog and candidate
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/test-release-version.py
          python3 dev/test-release-candidate.py
          python3 dev/test-release-packages.py
          version=$(python3 dev/release_version.py --tag "${RELEASE_TAG}")
          source_sha=$(git rev-parse HEAD)
          candidate_run=$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow release-candidate.yml --commit "${source_sha}" \
            --event workflow_dispatch --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if [[ ! "${candidate_run}" =~ ^[0-9]+$ ]]; then
            echo 'Run Release candidate verification successfully for this tag before publishing.' >&2
            exit 1
          fi
          printf 'version=%s\nsource-sha=%s\ncandidate-run-id=%s\n' \
            "${version}" "${source_sha}" "${candidate_run}" >>"${GITHUB_OUTPUT}"

  build:
    name: Verify release package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      manifest-sha256: ${{ steps.candidate.outputs.manifest-sha256 }}
      release-manifest-sha256: ${{ steps.release.outputs.release-manifest-sha256 }}
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Download the tested candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: zklink-candidate
          path: artifacts/candidate
          run-id: ${{ needs.validate.outputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - name: Verify package identity and provenance
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/release_candidate.py export artifacts/candidate
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          if json.loads(Path('artifacts/candidate/candidate.json').read_text())['version'] != os.environ['PACKAGE_VERSION']:
              raise SystemExit('Candidate package version differs from the release tag')
          PY
          gh attestation verify "artifacts/candidate/ZkLink.${PACKAGE_VERSION}.nupkg" \
            --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml"
          gh attestation verify "artifacts/candidate/ZkLink.${PACKAGE_VERSION}.snupkg" \
            --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml"
      - name: Verify installed package and examples on both server versions
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
          ZKLINK_CANDIDATE_DIRECTORY: ${{ github.workspace }}/artifacts/candidate
          ZKLINK_CANDIDATE_MANIFEST_SHA256: ${{ steps.candidate.outputs.manifest-sha256 }}
        run: bash dev/test-core-package.sh "${PACKAGE_VERSION}"
      - name: Test and pack DI and analyzers
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          dotnet restore tests/ZkLink.Extensions.DependencyInjection.Tests --locked-mode
          dotnet restore tests/ZkLink.Analyzers.Tests --locked-mode
          dotnet test --project tests/ZkLink.Extensions.DependencyInjection.Tests -c Release --no-restore
          dotnet test --project tests/ZkLink.Analyzers.Tests -c Release --no-restore
          dotnet pack src/ZkLink.Extensions.DependencyInjection -c Release --no-restore \
            -p:Version="${PACKAGE_VERSION}" -p:ContinuousIntegrationBuild=true -o artifacts/candidate
          dotnet pack src/ZkLink.Analyzers -c Release --no-restore \
            -p:Version="${PACKAGE_VERSION}" -p:ContinuousIntegrationBuild=true -o artifacts/candidate
      - name: Validate the complete release package set
        id: release
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: python3 dev/release-packages.py manifest artifacts/candidate --version "${PACKAGE_VERSION}"
      - name: Verify all three installed packages and analyzer diagnostics
        env:
          RELEASE_MANIFEST_SHA256: ${{ steps.release.outputs.release-manifest-sha256 }}
        run: python3 dev/release-packages.py consumer artifacts/candidate --sha256 "${RELEASE_MANIFEST_SHA256}"
      - name: Upload verified publish artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zklink-release-package
          path: artifacts/candidate
          if-no-files-found: error
      - name: Retain package verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zklink-release-verification
          path: |
            artifacts/packages
            artifacts/release-consumers
          if-no-files-found: warn

  publish:
    needs: [validate, build]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - name: Download verified publish artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: zklink-release-package
          path: artifacts/candidate
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Check package hashes before publishing
        env:
          RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release-manifest-sha256 }}
        run: python3 dev/release-packages.py verify artifacts/candidate --sha256 "${RELEASE_MANIFEST_SHA256}"
      - name: Attest all three packages and adjacent symbols
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/candidate/*.nupkg
            artifacts/candidate/*.snupkg
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish all three packages and adjacent symbols to NuGet.org
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package_id in ZkLink ZkLink.Extensions.DependencyInjection ZkLink.Analyzers; do
            dotnet nuget push "artifacts/candidate/${package_id}.${PACKAGE_VERSION}.nupkg" \
              --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json
          done

  verify-public:
    name: Verify public installation and symbols
    needs: [validate, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - name: Download verified publish artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: zklink-release-package
          path: artifacts/candidate
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify all three public packages and indexed companion symbols
        env:
          RELEASE_MANIFEST_SHA256: ${{ needs.build.outputs.release-manifest-sha256 }}
        run: python3 dev/release-packages.py public artifacts/candidate --sha256 "${RELEASE_MANIFEST_SHA256}"
      - name: Retain public-feed verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zklink-public-consumer
          path: artifacts/release-consumers/public.*
          if-no-files-found: error
