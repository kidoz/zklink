name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    name: Validate release version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release validation
        run: python3 dev/test-release-version.py
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == release ]]; then
            version=$(python3 dev/release_version.py --tag "${GITHUB_REF_NAME}")
          else
            version=$(python3 dev/release_version.py --manual)
          fi
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

  verification:
    name: Build, contracts and live verification
    needs: validate
    uses: ./.github/workflows/build.yml

  native:
    name: Native publish and live verification
    needs: validate
    uses: ./.github/workflows/native-aot.yml

  nuget:
    name: Verify and publish core package
    needs: [validate, verification, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify the exact release package and installed examples on both versions
        run: bash dev/test-core-package.sh "${PACKAGE_VERSION}"
      - name: Attest package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/packages/run.*/feed/*.nupkg
            artifacts/packages/run.*/feed/*.snupkg
      - name: Retain release packages and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zklink-release-packages
          path: |
            artifacts/packages/run.*/feed
            artifacts/packages/run.*/*.txt
            artifacts/packages/run.*/*.json
            artifacts/packages/run.*/*.log
            artifacts/packages/run.*/*-compose.yaml
            artifacts/packages/run.*/rejections
            artifacts/packages/run.*/consumer/obj/packages.lock.json
            artifacts/packages/run.*/consumer/obj/project.assets.json
          if-no-files-found: error
      - name: NuGet login with trusted publishing
        id: nuget-login
        if: github.event_name == 'release'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package and adjacent symbols to NuGet.org
        if: github.event_name == 'release'
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/packages/run.*/feed/*.nupkg)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo 'Expected exactly one verified core package.' >&2
            exit 1
          fi
          # The adjacent snupkg is uploaded by this same push. Duplicates must fail.
          dotnet nuget push "${packages[0]}" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json
