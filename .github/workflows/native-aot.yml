name: Native AOT verification

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  publish:
    name: Native publish and executable identity (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: macos-26
            rid: osx-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish both consumers and directly verify native identity
        run: python dev/prepare-aot.py ${{ matrix.rid }}
      - name: Retain native artifacts and analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-publish-${{ matrix.rid }}
          path: |
            artifacts/aot/run.*/feed
            artifacts/aot/run.*/*-publish
            artifacts/aot/run.*/*.txt
            artifacts/aot/run.*/*.json
            artifacts/aot/run.*/ZkLink.Aot*/obj/packages.lock.json
            artifacts/aot/run.*/ZkLink.Aot*/obj/project.assets.json
          if-no-files-found: error

  live:
    name: Native TLS and session operations (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            fixture: docker
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            fixture: docker
          - os: windows-2025
            rid: win-x64
            fixture: java
          - os: macos-26
            rid: osx-arm64
            fixture: java
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Install pinned fixture JDK
        if: matrix.fixture == 'java'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.5+8.0.LTS'
      - name: Publish and run native consumers against both server versions
        if: matrix.fixture == 'docker'
        run: bash dev/test-native-aot.sh
      - name: Publish and run native consumers with portable Java fixtures
        if: matrix.fixture == 'java'
        run: python dev/test-portable-aot.py
      - name: Retain native live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-live-${{ matrix.rid }}
          path: |
            artifacts/aot/run.*/feed
            artifacts/aot/run.*/*-publish
            artifacts/aot/run.*/*.txt
            artifacts/aot/run.*/*.json
            artifacts/aot/run.*/*.log
            artifacts/aot/run.*/*-compose.yaml
            artifacts/aot/run.*/ZkLink.Aot*/obj/packages.lock.json
            artifacts/aot/run.*/ZkLink.Aot*/obj/project.assets.json
            artifacts/portable-aot/run.*/*.txt
            artifacts/portable-aot/run.*/*.json
            artifacts/portable-aot/run.*/*.log
            artifacts/portable-aot/run.*/*.properties
            artifacts/portable-aot/run.*/*.xml
            artifacts/portable-aot/run.*/gradle.lockfile
            artifacts/portable-aot/run.*/java/*/dependencies.tsv
          if-no-files-found: error
